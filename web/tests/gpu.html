<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Fractal family GPU checks</title>
<style>body{font:16px system-ui;background:#101c20;color:#e0eddd;padding:32px}td,th{padding:8px 16px;text-align:left}canvas{width:256px;height:192px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Fractal family GPU checks</h1><p>Development test: compare GPU fields with binary64 CPU iteration and show the rendered families.</p>
<button id="run">Run GPU checks</button><p id="status">Ready</p><table><thead><tr><th>Formula / settings</th><th>Classification differences</th><th>Max scalar error</th><th>GPU / CPU ms</th></tr></thead><tbody id="results"></tbody></table><div id="images"></div>
<script type="module">
import { BrowserEngine } from '../src/engine.js';
import { softwareRender } from '../src/software.mjs';
import { defaultView, kinds } from '../src/fractals.mjs';
const base={x:'-.5',y:'0',span:'3.6',fractal:'mandelbrot',iterations:800,bailout:64,julia_x:'-.7269',julia_y:'.1889'};
const palettes=await(await fetch('../palettes.json')).json();
document.querySelector('#run').onclick=async()=>{
  const status=document.querySelector('#status');status.textContent='Running…';
  document.querySelector('#run').disabled=true;document.querySelector('#results').replaceChildren();document.querySelector('#images').replaceChildren();
  let bad=0;
  try {
    const canvas=document.createElement('canvas');const engine=new BrowserEngine(canvas,palettes);
    try {
      const hardware=await engine.init();if(!hardware.gpu)throw Error(hardware.error);
      const cases=kinds.map(kind=>defaultView(base,kind));
      for(const kind of kinds.slice(5)){
        const v=defaultView(base,kind);
        if(v.power)cases.push({...v,power:8});
        if(v.memory!==undefined)cases.push({...v,memory:.22,julia_x:'-.5',julia_y:'.2'});
        if(v.relaxation)cases.push({...v,power:5,relaxation:.75,julia_x:'.7',julia_y:'.4'});
      }
      cases.push({...defaultView(base,'newton'),julia_x:'0',julia_y:'0'});
      for(const custom_mode of ['mandelbrot','julia'])for(const custom_formula of [
        'z^2+c', 'z^3+c', 'z^2+c-0.5*z1', 'z^2+c+0.2*z1-0.1*z2+0.01*z3-0.005*z4',
        'ln(z^2+1)+c', 'e^z-1+c', 'sin(z)+c', 'cos(z)+c', 'tan(z)+c',
        'sinh(z)+c', 'cosh(z)+c', 'sqrt(z)+c', 'abs(z)+c', 'conj(z)^2+c',
        're(z)^2+im(z)*i+c', 'z/2+c', 'pow(z,2.5)+c', 'z^-2+c', '1/z', 'ln(z)',
      ])cases.push({...defaultView(base,'custom'),iterations:80,custom_mode,custom_formula});
      for(const v of cases){
        const gpu=await engine.render(v,33,25,{}), values=await engine.readField();
        const cpu=await softwareRender(v,33,25);
        let mismatch=0,error=0;
        values.forEach((value,i)=>{if(!Number.isFinite(value))bad++;if((value<0)!==(cpu.field[i]<0))mismatch++;else if(value>=0)error=Math.max(error,Math.abs(value-cpu.field[i]));});
        const row=document.createElement('tr');
        const label=v.fractal==='custom'?`custom ${v.custom_mode}: ${v.custom_formula}`:`${v.fractal} ${v.power?`d=${v.power}`:''} ${v.memory!==undefined?`p=${v.memory}`:''} ${v.relaxation?`λ=${v.relaxation}`:''}`;
        for(const value of [label,`${mismatch} / ${values.length}`,error.toFixed(6),`${gpu.metadata.elapsed_ms.toFixed(1)} / ${cpu.metadata.elapsed_ms.toFixed(1)}`]){const td=document.createElement('td');td.textContent=value;row.append(td);}
        document.querySelector('#results').append(row);
        if(kinds.slice(5).includes(v.fractal)&&!document.querySelector(`#image-${v.fractal}`)){
          await engine.render(v,256,192,{});engine.paint(0,1,0);
          const copy=document.createElement('canvas');copy.width=256;copy.height=192;copy.id=`image-${v.fractal}`;copy.getContext('2d').drawImage(canvas,0,0);
          const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=label;figure.append(copy,caption);document.querySelector('#images').append(figure);
        }
      }
      status.textContent=`Complete · ${cases.length} configurations · ${bad} non-finite pixels · ${hardware.device}`;
    } finally {engine.destroy();}
  } catch(error){status.textContent=`FAILED: ${error.message}`;}
  document.querySelector('#run').disabled=false;
};
</script></html>
