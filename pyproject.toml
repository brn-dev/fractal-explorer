[project]
name = "fractal-explorer"
version = "0.1.0"
description = "A local CUDA fractal explorer with arbitrary-precision reference orbits"
license = "MIT"
authors = [{ name = "Dominik Baron" }]
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.2,<3", "numba>=0.61,<1", "mpmath>=1.3,<2", "gmpy2>=2.2,<3", "pillow>=11,<13"]

[project.optional-dependencies]
cuda = ["cupy-cuda13x[ctk]>=14,<15"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
fractal-explorer = "fractal_explorer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fractal_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
